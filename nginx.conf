# Serves the built SPA. Dropped in at /etc/nginx/conf.d/default.conf.
#
# TLS, the canonical-host redirect and HSTS are deliberately NOT here — a
# reverse proxy terminates TLS in front of this container, which listens on
# plain HTTP on the loopback interface only.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # REQUIRED behind the TLS-terminating proxy. try_files' $uri/ matches the
    # prerendered directories (/pricing/, /faq/, ...), so nginx answers a bare
    # /pricing with a 301 to the slashed form. By default it builds that Location
    # as an absolute URL from its OWN scheme — and this container listens on
    # plain :80 — so https://host/pricing redirected to http://host/pricing/,
    # which the host Caddy then bounced back to https. Five of the six sitemap
    # URLs went through that https->http->https downgrade, and Google's Rich
    # Results Test reported "URL is not available to Google" for /pricing on
    # 2026-07-28 while / (which needs no redirect) passed.
    #
    # off = emit a relative "Location: /pricing/", so the client keeps whatever
    # scheme it arrived on and nginx never contradicts the proxy.
    absolute_redirect off;

    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml
        application/rss+xml;

    # NOTE ON add_header: nginx does NOT merge these across levels. A location
    # block containing any add_header discards every add_header inherited from
    # the server block. That is why the security headers below are repeated in
    # each location that sets its own — deleting the "duplicates" silently
    # drops those headers for that location.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # Content-hashed filenames (index-BHQSbmIO.js), so a given URL's bytes can
    # never change. Safe to cache hard and forever.
    # ^~ is load-bearing: a regex location beats a plain prefix location in
    # nginx, so without it the media block below would hijack hashed .svg and
    # .woff2 files out of here and cache them for 7d instead of forever.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control          "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;

        try_files $uri =404;
    }

    # Kept above the media regex on purpose: nginx tries regex locations in
    # order, so placing this last would let /.hidden.jpg match the media block
    # and be served before this ever ran.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Media copied straight from public/ — the hero video and poster, case
    # study images, the favicon. These are the largest payloads on the site,
    # and without this they fall through to the SPA fallback below and are
    # served with no cache directive at all.
    #
    # Bounded, NOT immutable: unlike /assets/ these filenames carry no content
    # hash, so replacing a video must not leave visitors pinned to the old one
    # for a year.
    location ~* \.(mp4|webm|jpg|jpeg|png|webp|avif|svg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control          "public" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;

        try_files $uri =404;
    }

    # The entry point must never be cached, or visitors stay pinned to an old
    # bundle after a deploy and keep requesting asset hashes that no longer
    # exist. Reached both directly and via the SPA fallback below, since
    # try_files re-enters location matching on its internal redirect.
    location = /index.html {
        add_header Cache-Control          "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
    }

    # REQUIRED: react-router BrowserRouter with 8 client-side routes. Without
    # this fallback, / works but /services, /pricing, /about and the rest all
    # 404 on direct load or refresh — they exist only in the client bundle,
    # not on disk. This is the single most likely thing to break in a deploy.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
