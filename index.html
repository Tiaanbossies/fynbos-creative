<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The badge alone, not the full lockup — "Fynbos / CREATIVE" is unreadable
      at 16px. The PNG is the supplied 192px export, used where an SVG icon is
      not honoured (Android home screens, iOS "Add to Home Screen").
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&family=Alex+Brush&display=swap"
      rel="stylesheet"
    />

    <title>Small Business Web Design South Africa — Fynbos Creative</title>
    <meta
      name="description"
      content="Websites built for small South African businesses from R1,200 once-off, then R349/mo to keep it hosted, updated and found on Google. Founder-led, no jargon."
    />

    <!--
      Homepage defaults. scripts/prerender.mjs rewrites title, description,
      canonical and the og:/twitter: values below into a static per-route
      index.html at build time, so every URL shares correctly on WhatsApp,
      Facebook and LinkedIn without relying on client JavaScript.

      It skips '/' entirely, so THIS file is the homepage's baked metadata: the
      title and description here (and their og:/twitter: copies) must stay
      identical to SITE.defaultTitle and SITE.defaultDescription in
      src/lib/seo.js, which is what useSeo sets on client navigation. Edit both,
      or a crawler and a browser see different titles for the same URL.

      The build checks this rather than trusting the comment: prerender.mjs
      runs assertHomepageMirror over all six tags below and fails the build on
      any mismatch, naming the tag and both values.
    -->
    <link rel="canonical" href="https://fynboscreative.co.za/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fynbos Creative" />
    <meta property="og:locale" content="en_ZA" />
    <meta property="og:title" content="Small Business Web Design South Africa — Fynbos Creative" />
    <meta
      property="og:description"
      content="Websites built for small South African businesses from R1,200 once-off, then R349/mo to keep it hosted, updated and found on Google. Founder-led, no jargon."
    />
    <meta property="og:url" content="https://fynboscreative.co.za/" />
    <meta property="og:image" content="https://fynboscreative.co.za/video/preview-frame.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Small Business Web Design South Africa — Fynbos Creative" />
    <meta
      name="twitter:description"
      content="Websites built for small South African businesses from R1,200 once-off, then R349/mo to keep it hosted, updated and found on Google. Founder-led, no jargon."
    />
    <meta name="twitter:image" content="https://fynboscreative.co.za/video/preview-frame.jpg" />

    <!--
      The site-wide business entity. Prerender copies this <head> to every
      route, so this block is what identifies the business on all of them.

      ProfessionalService is kept rather than swapped for LocalBusiness: it is a
      subtype of LocalBusiness, so it already inherits address, telephone,
      areaServed and sameAs, and the more specific type is the better signal.

      The address carries locality, region and country but NO streetAddress,
      because this is a service-area business with no premises to visit. That is
      a deliberate omission, not a TODO — inventing a street would be a claim
      about the business nobody has made, and a wrong one earns a manual action.

      areaServed lists Centurion and Pretoria *alongside* South Africa rather
      than replacing it. The visible copy says "across South Africa" and
      "serving businesses nationwide"; narrowing the schema to two cities would
      have the structured data contradict the page it sits on. The local signal
      comes from the address and the Google Business Profile in sameAs.

      telephone must stay in step with WHATSAPP_NUMBER in src/lib/whatsapp.js —
      they are the same number and nothing checks that they agree.

      logo is a PNG, not the SVG the site itself loads: Google does not accept
      SVG here. It is public/fynbos-lockup-512.png, rasterised from
      public/fynbos-lockup.svg — regenerate it from there rather than editing
      it, or the knowledge-panel logo drifts from the one on the page.

      logo and image stay different on purpose. image is the hero poster, a
      photograph standing in for the business; logo is the mark Google may put
      in a knowledge panel, where a photograph would be wrong.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Fynbos Creative",
        "description": "Founder-led, done-for-you web services and media for small South African businesses.",
        "url": "https://fynboscreative.co.za/",
        "email": "tiaan@fynboscreative.co.za",
        "telephone": "+27628034558",
        "image": "https://fynboscreative.co.za/video/preview-frame.jpg",
        "logo": "https://fynboscreative.co.za/fynbos-lockup-512.png",
        "founder": { "@type": "Person", "name": "Tiaan" },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Lyttelton, Centurion",
          "addressRegion": "Gauteng",
          "addressCountry": "ZA"
        },
        "areaServed": [
          { "@type": "City", "name": "Centurion" },
          { "@type": "City", "name": "Pretoria" },
          { "@type": "Country", "name": "South Africa" }
        ],
        "sameAs": ["https://share.google/zG0cBzHj1RlApNw6F"],
        "slogan": "Rooted in local. Built to grow."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
