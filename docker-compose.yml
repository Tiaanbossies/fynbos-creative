name: fynbos-creative

# This stack runs the site container ONLY.
#
# There is no Caddy service here on purpose: the host already runs Caddy
# (systemd, outside Docker) terminating TLS for the other apps on this box. A
# second Caddy in a container cannot bind 80/443 and would fight the existing
# one for them. The host Caddy proxies to the loopback port below — the same
# pattern crateflow-web already uses on 127.0.0.1:3000.
#
# See Caddyfile in this repo for the vhost block to add to /etc/caddy/Caddyfile.

services:
  site:
    build:
      context: .
      args:
        # Fails the build immediately with this message if unset, rather than
        # producing an image whose contact form silently shows the fallback
        # instead of sending. Put it in .env next to this file:
        #   echo "VITE_FORMSPREE_ID=xojgdbvq" > .env
        VITE_FORMSPREE_ID: ${VITE_FORMSPREE_ID:?set VITE_FORMSPREE_ID before building - the contact form is inert without it}
    image: fynbos-creative:latest
    restart: unless-stopped
    # Loopback only. Publishing on 0.0.0.0 would expose the site over plain
    # HTTP on port 8080, bypassing TLS and the canonical-host redirect.
    ports:
      - '127.0.0.1:8080:80'
